# Databricks Asset Bundle: deploys the pipeline as a scheduled job.
#   databricks bundle deploy -t dev && databricks bundle run energy_pipeline -t dev
bundle:
  name: energy-forecasting

resources:
  jobs:
    energy_pipeline:
      name: energy-forecasting-pipeline
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"   # nightly at 02:00, after meter data lands
        timezone_id: Europe/Monaco
        pause_status: PAUSED
      parameters:
        - {name: catalog, default: workspace}
        - {name: schema, default: energy}
      tasks:
        - task_key: bronze
          notebook_task: {notebook_path: ./databricks/01_bronze_ingest.py}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: ./databricks/02_silver_clean.py}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ./databricks/03_gold_features.py}

targets:
  dev:
    mode: development
    default: true

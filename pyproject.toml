[project]
name = "energyfc"
version = "0.1.0"
description = "Day-ahead meter-level energy forecasting and anomaly detection (Databricks + Dataiku)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["databricks"]  # Databricks notebook source uses injected globals (spark, dbutils, display)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["energyfc"]
